<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google OTP Setup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5 text-center">
        <div class="card shadow p-4 mx-auto" style="max-width: 500px;">
            <h4 class="mb-3">Scan this QR Code with Google Authenticator</h4>
            <p class="text-muted">Use the app to generate verification codes for login.</p>
            <img src="{{ qr_code_url }}" alt="QR Code" class="img-fluid" style="max-width: 300px;" />
            <p class="mt-3"><strong>Or manually enter code:</strong> {{ otp_key }}</p>
            <a href="{% url 'verify_google_otp' %}" class="btn btn-success mt-3">Continue</a>
        </div>
    </div>
</body>
</html>
